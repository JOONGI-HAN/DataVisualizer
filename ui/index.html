<!DOCTYPE html>
<html lang = "en">
<head>
	<meta charset = "UTF-8">
	<meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
	<title>CSV Chart Generator</title>
	<link rel = "stylesheet" href = "./style.css">
</head>
<body>
	<main class = "app">
		<header class = "header">
			<h1 class = "header--title">CSV Chart Generator</h1>
			<input class = "fileSelector" type = "file" accept = ".csv, .xls, .xlsx, .ods">
		</header>

		<section class = "dataPreview">
			<h2 class = "dataPreview--title">Data preview</h2>
			<div class = "dataPreview--container"></div>
		</section>

		<section class = "chart">
			<h2 class = "chart--title">Chart</h2>
			<div class = "chart--container">
				<canvas id = "chart"></canvas>
			</div>
		</section>
	</main>

	<script src = "./dist/main.js"></script>
</body>
</html>
