<!DOCTYPE html>
<html lang = "en">
<head>
	<meta charset = "UTF-8">
	<meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
	<title>CSV Chart Generator</title>
	<link rel = "stylesheet" href = "./style.css">
</head>
<body>
	<main class = "app">
		<header class = "header">
			<h1 class = "header--title">CSV Chart Generator</h1>
			<input class = "fileSelector" type = "file" accept = ".csv">
		</header>

		<section class = "dataPreview">
			<h2 class = "dataPreview--title">Data preview</h2>
			<div class = "dataPreview--container"></div>
		</section>

		<section class = "chart">
			<div class = "chart-header--container">
				<h2 class = "chart--title">Chart</h2>
				<div class = "chart-export--container">
					<img src = "./assets/export-icon.svg" alt = "export" height = 18 width = 18 />
					<button type = "button" class = "chart-export button">Export</button>
				</div>
			</div>
			<div class = "chart--container">
				<canvas id = "chart"></canvas>
				<div class = "loading--spinner hidden"></div>
			</div>
		</section>
	</main>

	<script src = "./dist/main.js"></script>
</body>
</html>
